name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: Go tests
        working-directory: agent
        run: go test ./...
      - name: Protobuf drift
        working-directory: agent
        run: |
          go run github.com/bufbuild/buf/cmd/buf@v1.47.2 generate ../proto
          git diff --exit-code -- gen
      - name: Rust toolchain
        run: rustup update stable && rustup default stable
      - name: Rust format
        working-directory: master
        run: cargo fmt -- --check
      - name: Rust tests and feature builds
        working-directory: master
        run: |
          cargo test --locked
          cargo test --locked --features dial-acceptor
          cargo check --locked --features tls
          cargo check --locked --features acme
          cargo check --locked --features dial-acceptor,acme
      - name: UI and shell syntax
        run: |
          node --check web/app.js
          bash -n scripts/*.sh
      - name: Release metadata preflight
        run: bash scripts/release-readiness.sh --static

  database-recovery:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: honey
          POSTGRES_PASSWORD: honey
          POSTGRES_DB: honey
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U honey -d honey"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://honey:honey@127.0.0.1:5432/honey
      ADMIN_DATABASE_URL: postgres://honey:honey@127.0.0.1:5432/postgres
      HONEY_SECRET_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - uses: actions/checkout@v6
      - name: Rust toolchain
        run: rustup update stable && rustup default stable
      - name: PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Empty-database migrations and API lifecycle
        env:
          HONEY_API_TOKEN: ci-test-token
          HONEY_BASE_URL: http://127.0.0.1:18080
        run: |
          cargo run --locked --manifest-path master/Cargo.toml -- migrate
          cargo run --locked --manifest-path master/Cargo.toml -- serve --listen 127.0.0.1:18080 &
          master_pid=$!
          trap 'kill "$master_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS "$HONEY_BASE_URL/ready"; then break; fi
            sleep 1
          done
          curl -fsS "$HONEY_BASE_URL/ready"
          bash scripts/e2e-api.sh
      - name: Backup and real restore rehearsal
        run: |
          backup_file="$(HONEY_BACKUP_KEEP=2 bash scripts/backup-postgres.sh "$RUNNER_TEMP/backups")"
          test -s "$backup_file"
          test -s "${backup_file}.sha256"
          bash scripts/restore-check.sh "$backup_file"
      - name: Master-key disaster recovery rehearsal
        env:
          HONEY_MASTER_BIN: master/target/debug/honey-master
        run: bash scripts/secret-recovery-check.sh
      - name: Upgrade from preserved migration baseline
        env:
          HONEY_MASTER_BIN: master/target/debug/honey-master
          HONEY_BASELINE_MIGRATIONS: "12"
        run: bash scripts/migration-upgrade-check.sh
      - name: Disposable master-agent lifecycle
        env:
          HONEY_MASTER_BIN: master/target/debug/honey-master
        run: bash scripts/lifecycle-linux.sh

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Secret scan
        run: |
          docker run --rm \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/repo \
            -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --redact --verbose /repo
