name: Feature request
description: Propose a scoped product or operator improvement
title: "[feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What operator or user problem should honey solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the interface, API or operational behavior.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and trade-offs
      description: What else did you consider?
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: I checked existing issues and discussions.
          required: true
        - label: This request contains no live credentials or deployment secrets.
          required: true
