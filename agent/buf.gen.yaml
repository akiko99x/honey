# run from the agent/ dir:  buf generate ../proto
# outputs generated go into agent/gen/honey/v1 (matches go_package in the protos).
version: v2
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.11
    out: gen
    opt: paths=source_relative
  - remote: buf.build/grpc/go:v1.6.2
    out: gen
    opt: paths=source_relative
