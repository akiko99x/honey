  <header class="topbar">
    <button class="icon-button mobile-only" id="menu-toggle" aria-label="Open navigation"><svg><use href="#i-menu"/></svg></button>
    <a class="brand" href="#overview" aria-label="honey home">
      <span class="brand-mark"><i></i><i></i><i></i></span>
      <span>honey</span>
    </a>
    <div class="top-context"><span class="crumb">master</span><span class="plan-badge" data-i18n="self-hosted">self-hosted</span></div>
    <div class="top-actions">
      <span class="health-copy" id="health-copy" data-i18n="checking">checking</span>
      <div class="notification-center" id="notification-center" hidden>
        <button class="icon-button notification-button" id="notification-button" data-action="toggle-notifications" aria-label="Notifications" aria-expanded="false">
          <svg><use href="#i-bell"/></svg><span class="notification-badge" id="notification-badge" hidden>0</span>
        </button>
        <section class="notification-panel" id="notification-panel" hidden aria-label="Notifications">
          <header><div><b data-i18n="Notifications">Notifications</b><span id="notification-summary" data-i18n="No unread alerts">No unread alerts</span></div><button class="link" data-action="mark-all-notifications" data-i18n="Mark all read">Mark all read</button></header>
          <div class="notification-filters">
            <select data-notification-filter="severity" aria-label="Severity"><option value="" data-i18n="All severity">All severity</option><option value="critical" data-i18n="Critical">Critical</option><option value="warning" data-i18n="Warning">Warning</option><option value="info" data-i18n="Info">Info</option></select>
            <select data-notification-filter="event" aria-label="Event"><option value="" data-i18n="All events">All events</option><option value="node_down" data-i18n="Node down">Node down</option><option value="push_failed" data-i18n="Push failed">Push failed</option><option value="cert_expiry" data-i18n="Certificate expiry">Certificate expiry</option><option value="quota_reset" data-i18n="Quota reset">Quota reset</option><option value="traffic_anomaly" data-i18n="Traffic spike">Traffic spike</option><option value="device_limit" data-i18n="Device limit">Device limit</option><option value="config_drift" data-i18n="Config drift">Config drift</option></select>
            <label><input type="checkbox" data-notification-filter="unread"> <span data-i18n="unread">unread</span></label>
          </div>
          <div class="notification-list" id="notification-list"></div>
        </section>
      </div>
      <button class="text-button" id="token-button" data-i18n="sign in">sign in</button>
      <button class="icon-button" id="theme-button" aria-label="Switch theme"><svg><use href="#i-sun"/></svg></button>
    </div>
  </header>

  <aside class="sidebar" id="sidebar">
    <button class="side-search" data-command-open>
      <svg><use href="#i-search"/></svg>
      <span data-i18n="Quick search...">Quick search...</span>
      <kbd>Ctrl K</kbd>
    </button>
    <nav class="nav" aria-label="Main navigation">
      <button class="nav-item active" data-route="overview"><svg><use href="#i-home"/></svg><span data-i18n="Overview">Overview</span></button>
      <div id="category-nav-root"></div>
    </nav>
    <div class="sidebar-foot">
      <button class="collapse-button" id="collapse-button" aria-label="Collapse sidebar"><svg><use href="#i-chevron"/></svg></button>
    </div>
  </aside>

  <main class="main" id="view" tabindex="-1">
    <div class="page-loading"><span></span><span></span><span></span></div>
  </main>

  <dialog class="command-dialog" id="command-dialog">
    <div class="command-box">
      <div class="command-input-wrap"><svg><use href="#i-search"/></svg><input id="command-input" autocomplete="off" placeholder="Search pages, nodes, users and actions..." data-i18n-ph="Search pages, nodes, users and actions..."><kbd>Esc</kbd></div>
      <div class="command-results" id="command-results"></div>
      <footer><span><kbd>↑</kbd><kbd>↓</kbd> <span data-i18n="navigate">navigate</span></span><span><kbd>Enter</kbd> <span data-i18n="open">open</span></span></footer>
    </div>
  </dialog>

  <dialog class="modal" id="form-dialog">
    <form method="dialog" id="entity-form">
      <header><div><span class="eyebrow" id="form-eyebrow">add</span><h2 id="form-title">Add item</h2></div><button value="cancel" class="icon-button" aria-label="Close"><svg><use href="#i-x"/></svg></button></header>
      <div class="form-body" id="form-body"></div>
      <footer><button value="cancel" class="button secondary" data-i18n="Cancel">Cancel</button><button value="default" class="button primary" id="form-submit">Add</button></footer>
    </form>
  </dialog>

  <div class="toast-region" id="toasts" aria-live="polite"></div>
  <script src="./app.js" defer></script>
</body>
</html>
