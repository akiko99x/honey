// minimal subset of xray-core's app/stats/command/command.proto.
// the package + service + field numbers must match xray for wire compatibility;
// we only need QueryStats to read per-user traffic counters.
syntax = "proto3";

package xray.app.stats.command;

option go_package = "github.com/akiko99x/honey/agent/gen/xray/statscmd;statscmd";

message GetStatsRequest {
  string name = 1;
  bool   reset = 2;
}

message Stat {
  string name = 1;
  int64  value = 2;
}

message GetStatsResponse {
  Stat stat = 1;
}

message QueryStatsRequest {
  string pattern = 1;
  bool   reset = 2;
}

message QueryStatsResponse {
  repeated Stat stat = 1;
}

service StatsService {
  rpc GetStats(GetStatsRequest) returns (GetStatsResponse);
  rpc QueryStats(QueryStatsRequest) returns (QueryStatsResponse);
}
